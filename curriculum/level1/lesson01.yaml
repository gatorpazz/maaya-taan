number: 1
title: Meeting someone
title_es: Conocer a alguien
opening:
  id: l01_open
  setting_en: Two neighbors, José and Luis, meet on the street in the morning.
  setting_es: Dos vecinos, José y Luis, se encuentran en la calle por la mañana.
  lines:
    - {speaker: A, yua: "Bix a beel", en: "How are you?", es: "¿Cómo estás?", attested_by: [YUAES0007004]}
    - {speaker: B, yua: "Ma'alob. Bix a beel", en: "Fine. How are you?", es: "Bien. ¿Cómo estás?", attested_by: [YUAES0007013, YUAES0007004]}
    - {speaker: A, yua: "Ma'alob. Bix a k'aaba'", en: "Fine. What's your name?", es: "Bien. ¿Cómo te llamas?", attested_by: [YUAES0007013, YUAES0004153]}
    - {speaker: B, yua: "In k'aaba'e' Luis. Bix a k'aaba'", en: "My name is Luis. What's your name?", es: "Me llamo Luis. ¿Cómo te llamas?", attested_by: [YUAES0004147, YUAES0004153]}
    - {speaker: A, yua: "José in k'aaba'", en: "My name is José.", es: "Me llamo José.", attested_by: [YUAES0004164]}
    - {speaker: B, yua: "Ma'alob túun. Tak sáamal", en: "Alright then. See you tomorrow.", es: "Bueno, está bien. Hasta mañana.", attested_by: [YUAES0007013, YUAES0007012]}
    - {speaker: A, yua: "Tak sáamal", en: "See you tomorrow.", es: "Hasta mañana.", attested_by: [YUAES0007012]}
items:
  - id: bix_a_beel
    yua: Bix a beel
    en: How are you?
    es: ¿Cómo estás?
    literal: how (is) your road
    literal_es: cómo (está) tu camino
    syllables: [beel, a beel, Bix a beel]
    glosses: {beel: road, a beel: your road, Bix a beel: how is your road}
    glosses_es: {beel: camino, a beel: tu camino, Bix a beel: cómo está tu camino}
    note: Literally, how is your road. Maya asks about your path, not your being.
    note_es: Literalmente, cómo está tu camino. El maya pregunta por tu camino, no por tu estado.
    cues:
      - You meet your neighbor in the morning. Ask how she is.
      - A friend walks up to you. Ask how he is doing.
    cues_es:
      - Te encuentras con tu vecina por la mañana. Pregúntale cómo está.
      - Un amigo se te acerca. Pregúntale cómo le va.
    attested_by: [YUAES0007004]
  - id: maalob
    yua: Ma'alob
    en: Fine. Good.
    es: Bien, o bueno
    syllables: [lob, a'alob, Ma'alob]
    note: Notice the small catch in the middle of the word. That's a glottal stop, written with an apostrophe.
    note_es: Fíjate en el pequeño corte en medio de la palabra. Es un cierre glotal, y se escribe con apóstrofo.
    cues:
      - Someone asks how you are. Tell them you're fine.
    cues_es:
      - Alguien te pregunta cómo estás. Dile que bien.
    attested_by: [YUAES0007013]
  - id: bix_a_kaaba
    yua: Bix a k'aaba'
    en: What's your name?
    es: ¿Cómo te llamas?
    literal: how (is) your name
    literal_es: cómo (es) tu nombre
    syllables: [ba', aaba', k'aaba', a k'aaba', Bix a k'aaba']
    glosses: {k'aaba': name, a k'aaba': your name}
    glosses_es: {k'aaba': nombre, a k'aaba': tu nombre}
    note: The k has a sharp pop to it. That's a glottalized k, written k with an apostrophe.
    note_es: La k suena con un pequeño estallido. Es una k glotalizada, y se escribe k con apóstrofo.
    cues:
      - You've just met someone. Ask their name.
    cues_es:
      - Acabas de conocer a alguien. Pregúntale su nombre.
    transforms:
      - {prompt_en: "Now ask, what's his name?", prompt_es: "Ahora pregunta, ¿cómo se llama él?", yua: "Bix u k'aaba'", attested_by: [YUAES0004155]}
    attested_by: [YUAES0004153]
  - id: in_kaabae
    yua: In k'aaba'e' Luis
    en: My name is Luis.
    es: Me llamo Luis
    literal: my name-is Luis
    literal_es: mi nombre-es Luis
    syllables: [e', ba'e', k'aaba'e', In k'aaba'e', In k'aaba'e' Luis]
    glosses: {In k'aaba'e': my name is}
    glosses_es: {In k'aaba'e': mi nombre es}
    note: In means my. When you say this yourself, put your own name at the end.
    note_es: In significa mi. Cuando lo digas tú, pon tu propio nombre al final.
    cues:
      - Someone asks your name. Tell them, using the name Luis.
    cues_es:
      - Alguien te pregunta tu nombre. Contesta usando el nombre Luis.
    transforms:
      - {prompt_en: "Say it the other way around, José my name, meaning I'm José.", prompt_es: "Dilo al revés, José mi nombre, o sea, yo soy José.", yua: "José in k'aaba'", attested_by: [YUAES0004164]}
    attested_by: [YUAES0004147]
  - id: tak_saamal
    yua: Tak sáamal
    en: See you tomorrow.
    es: Hasta mañana
    literal: until tomorrow
    literal_es: hasta mañana
    syllables: [mal, sáamal, Tak sáamal]
    glosses: {sáamal: tomorrow, Tak sáamal: until tomorrow}
    glosses_es: {sáamal: mañana, Tak sáamal: hasta mañana}
    cues:
      - You're leaving and will see your friend tomorrow. Say goodbye.
    cues_es:
      - Te vas, y verás a tu amigo mañana. Despídete.
    attested_by: [YUAES0007012]
  - id: maalob_tuun
    yua: Ma'alob túun
    en: Alright then. OK then.
    es: Bueno, está bien
    syllables: [túun, Ma'alob túun]
    glosses: {túun: then}
    glosses_es: {túun: entonces}
    note: Túun means then. You'll hear it at the end of many sentences.
    note_es: Túun significa entonces. Lo vas a oír al final de muchas frases.
    cues:
      - Your friend says they have to go. Say, alright then.
    cues_es:
      - Tu amigo dice que tiene que irse. Di, bueno, está bien.
    attested_by: [YUAES0007013]
  - id: taan_in_bin
    yua: Táan in bin
    en: I'm leaving. I'm going now.
    es: Ya me voy
    literal: progressive my going
    literal_es: progresivo mi ir
    syllables: [bin, in bin, Táan in bin]
    glosses: {bin: to go, in bin: my going}
    glosses_es: {bin: ir, in bin: mi ir}
    note: Bin is to go. Táan in bin, I'm going.
    note_es: Bin es ir. Táan in bin, ya me voy.
    cues:
      - It's late and you have to leave. Say, I'm going now.
    cues_es:
      - Es tarde y tienes que irte. Di, ya me voy.
    attested_by: [YUAES0007022]
  - id: tak_tu_jeel_kiin
    yua: Tak tu jeel k'iin
    en: See you later. Until another day.
    es: Hasta luego
    literal: until another day
    literal_es: hasta otro día
    syllables: [k'iin, jeel k'iin, tu jeel k'iin, Tak tu jeel k'iin]
    glosses: {k'iin: day, jeel k'iin: another day}
    glosses_es: {k'iin: día, jeel k'iin: otro día}
    note: K'iin means day, and also sun.
    note_es: K'iin significa día, y también sol.
    cues:
      - Say goodbye without promising a day.
    cues_es:
      - Despídete sin prometer un día.
    attested_by: [YUAES0007010]
grammar_note: "You've heard a in front of beel and k'aaba', your road, your name. And in in front of k'aaba', my name. A means your, in means my."
grammar_note_es: "Has oído a delante de beel y de k'aaba': tu camino, tu nombre. Y in delante de k'aaba': mi nombre. A significa tu, in significa mi."
closing:
  id: l01_close
  setting_en: Later the same day, José runs into Luis again and has to hurry off.
  setting_es: Más tarde ese mismo día, José se encuentra otra vez con Luis y tiene que irse de prisa.
  lines:
    - {speaker: A, yua: "Bix a beel Luis", en: "How are you, Luis?", es: "¿Cómo estás, Luis?", attested_by: [YUAES0007004]}
    - {speaker: B, yua: "Ma'alob. Bix a beel", en: "Fine. How are you?", es: "Bien. ¿Cómo estás?", attested_by: [YUAES0007013, YUAES0007004]}
    - {speaker: A, yua: "Ma'alob. Táan in bin", en: "Fine. I'm going now.", es: "Bien. Ya me voy.", attested_by: [YUAES0007025]}
    - {speaker: B, yua: "Ma'alob túun. Tak tu jeel k'iin", en: "Alright then. See you later.", es: "Bueno, está bien. Hasta luego.", attested_by: [YUAES0007013, YUAES0007010]}
    - {speaker: A, yua: "Tak tu jeel k'iin", en: "See you later.", es: "Hasta luego.", attested_by: [YUAES0007010]}
