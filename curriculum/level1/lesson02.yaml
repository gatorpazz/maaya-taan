number: 2
title: Good morning, good night
title_es: Buenos días, buenas noches
opening:
  id: l02_open
  setting_en: Early morning at home; a young man greets his mother in the kitchen before heading out.
  setting_es: Temprano en la mañana en casa; un joven saluda a su mamá en la cocina antes de salir.
  lines:
  - speaker: A
    yua: Diiyáas na'
    en: Good morning, Mom.
    es: Buenos días mamá.
    attested_by:
    - YUAES0006965
  - speaker: B
    yua: Bix túun
    en: Hey, how's it going?
    es: ¿Hola, qué tal?
    attested_by:
    - YUAES0007001
  - speaker: A
    yua: Ma'alob. Bix a beel
    en: Fine. How are you?
    es: Bien. ¿Cómo estás?
    attested_by:
    - words
  - speaker: B
    yua: Ma'alob
    en: Fine.
    es: Bien.
    attested_by:
    - words
  - speaker: A
    yua: Tin bin na'
    en: I'm off, Mom.
    es: Ya me voy mamá.
    attested_by:
    - YUAES0007078
  - speaker: B
    yua: Ma'alob túun. Kanáantabaj
    en: Alright then. Take care.
    es: Bueno, está bien. Cuídate.
    attested_by:
    - words
  - speaker: A
    yua: Tak tu jeel k'iin na'
    en: See you later, Mom.
    es: Hasta luego mamá.
    attested_by:
    - YUAES0007031
  - speaker: B
    yua: Tak tu jeel k'iin
