number: 2
title: Good day, good night
title_es: Buenos días, buenas noches
opening:
  id: l02_open
  setting_en: Morning at the market in a small town; a visitor greets the woman who sells fruit.
  setting_es: Por la mañana en el mercado de un pueblo; un visitante saluda a la señora que vende fruta.
  lines:
  - speaker: A
    yua: Ma'alob k'iin
    en: Good morning.
    es: Buenos días.
    attested_by:
    - STD0001
  - speaker: B
    yua: Ma'alob k'iin. Bix yanikech
    en: Good morning. How are you?
    es: Buenos días. ¿Cómo estás?
    attested_by:
    - words
  - speaker: A
    yua: Ma'alob. Bix a beel
    en: Fine. How are you?
    es: Bien. ¿Cómo estás?
    attested_by:
    - words
  - speaker: B
    yua: Ma'alob
    en: Fine.
    es: Bien.
    attested_by:
    - YUAES0007013
  - speaker: A
    yua: Ma'alob túun. Táan in bin
    en: Alright then. I'm off.
    es: Bueno, está bien. Ya me voy.
    attested_by:
    - words
  - speaker: B
    yua: Ka xi'ik tech uts
    en: Hope it goes well for you.
    es: Que te vaya bien.
    attested_by:
    - YUAES0007018
  - speaker: A
    yua: Tak ka'aka'ate'
    en: See you later today.
    es: Hasta más tarde.
    attested_by:
    - YUAES0007023
  - speaker: B
    yua: Ma'alob túun. Kanáantabaj
    en: Alright then. Take care.
    es: Bueno, está bien. Cuídate.
    attested_by:
    - words
items:
# The three time-of-day greetings are the standardized school-and-media forms; they are not corpus phrases.
# They are attested by data/standard_phrases.tsv (STD ids; sources in data/SOURCES.md).
- id: maalob_kiin
  yua: Ma'alob k'iin
  en: Good morning. Good day.
  es: Buenos días.
  syllables:
  - k'iin
  - Ma'alob k'iin
  literal: good day
  literal_es: buen día
  glosses:
    k'iin: day, sun
    Ma'alob: good
  glosses_es:
    k'iin: día, sol
    Ma'alob: bueno
  note: Literally, good day. It's the standard, courteous greeting; in everyday talk you'll also hear one borrowed from
    Spanish, but this is the one you'll hear in schools and on the radio.
  note_es: Literalmente, buen día. Es el saludo estándar y cortés; en la plática diaria también se oye uno tomado del
    español, pero este es el que se usa en la escuela y en la radio.
  cues:
  - You walk into a shop in the morning. Greet the owner politely.
  cues_es:
  - Entras a una tienda por la mañana. Saluda al dueño con cortesía.
  attested_by:
  - STD0001
- id: maalob_u_chiinil_kiin
  yua: Ma'alob u chíinil k'iin
  en: Good afternoon.
  es: Buenas tardes.
  syllables:
  - k'iin
  - chíinil k'iin
  - u chíinil k'iin
  - Ma'alob u chíinil k'iin
  literal: good its sinking sun
  literal_es: buena su bajada sol
  glosses:
    k'iin: sun, day
    chíinil k'iin: sinking of the sun
    u chíinil k'iin: the sun's going down
    Ma'alob: good
  glosses_es:
    k'iin: sol, día
    chíinil k'iin: bajada del sol
    u chíinil k'iin: la bajada del sol
    Ma'alob: bueno
  note: Literally, good going-down of the sun. Use it from after lunch until it's dark.
  note_es: Literalmente, buena bajada del sol. Se usa desde después de comer hasta que oscurece.
  cues:
  - It's three in the afternoon and you pass the woman selling tortillas. Greet her.
  cues_es:
  - Son las tres de la tarde y pasas junto a la señora que vende tortillas. Salúdala.
  attested_by:
  - STD0003
- id: maalob_aakab
  yua: Ma'alob áak'ab
  en: Good night.
  es: Buenas noches.
  syllables:
  - áak'ab
  - Ma'alob áak'ab
  literal: good night
  literal_es: buena noche
  glosses:
    áak'ab: night
    Ma'alob: good
  glosses_es:
    áak'ab: noche
    Ma'alob: bueno
  note: The word for night starts long and high, then has a popped k near the end. Say it both when you arrive after dark
    and when you leave for the night.
  note_es: La palabra para noche empieza larga y aguda, y lleva una k glotalizada, con un pequeño estallido, cerca del final. Se dice tanto al llegar
    ya de noche como al despedirse.
  cues:
  - You arrive at a friend's house after dark. Greet them.
  - You're heading to bed at the guesthouse. Say good night to the owner.
  cues_es:
  - Llegas a casa de un amigo ya de noche. Salúdalo.
  - Te vas a dormir en la posada. Dale las buenas noches al dueño.
  attested_by:
  - STD0004
- id: bix_yanikech
  yua: Bix yanikech
  en: How are you doing?
  es: ¿Cómo estás?
  syllables:
  - ikech
  - yanikech
  - Bix yanikech
  literal: how are-you
  literal_es: cómo estás-tú
  glosses:
    ikech: are-you
    yanikech: are you
    Bix: how
  glosses_es:
    ikech: estás-tú
    yanikech: estás tú
    Bix: cómo
  note: A fuller way to ask how someone is than the road one you know. Listen to the ending; it means you, and you'll meet
    it again soon.
  note_es: Una forma más completa de preguntar cómo está alguien que la del camino que ya conoces. Fíjate en la terminación;
    significa tú, y la vas a volver a oír pronto.
  cues:
  - You run into an acquaintance you haven't seen in a while. Ask how he's doing, the longer way that ends in the word for you.
  - Greet an older neighbor and ask how she is, using the longer way, not the one about her road.
  cues_es:
  - Te encuentras con un conocido que no veías hace tiempo. Pregúntale cómo está, con la forma más larga que termina en la palabra para tú.
  - Saluda a una vecina mayor y pregúntale cómo está, con la forma más larga, no con la del camino.
  attested_by:
  - YUAES0007002
- id: bix_tuun
  yua: Bix túun
  en: Hey, how's it going?
  es: Hola, ¿qué tal?
  syllables:
  - túun
  - Bix túun
  literal: how then
  literal_es: cómo entonces
  glosses:
    Bix: how
    túun: then, so
  glosses_es:
    Bix: cómo
    túun: entonces, pues
  note: You know the second word from alright then. Together it's a quick, casual so, how's it going, between people who
    know each other.
  note_es: La segunda palabra ya la conoces de bueno, está bien. Juntas son un ¿qué tal? rápido y de confianza.
  cues:
  - A friend walks up to you in the street. Give him the quick, casual, so, how's it going.
  cues_es:
  - Un amigo se te acerca en la calle. Dale el rápido y casual, ¿qué tal, pues?
  attested_by:
  - YUAES0007001
- id: kanaantabaj
  yua: Kanáantabaj
  en: Take care.
  es: Cuídate.
  syllables:
  - abaj
  - náantabaj
  - Kanáantabaj
  literal: guard-yourself
  literal_es: cuida-te
  glosses:
    abaj: yourself
    Kanáant: guard, look after
  glosses_es:
    abaj: a ti mismo
    Kanáant: cuidar, vigilar
  note: The ending means yourself. The long, high tone in the middle syllable carries the emphasis.
  note_es: La terminación significa a ti mismo. El tono largo y agudo de la sílaba del medio lleva el énfasis.
  cues:
  - Your friend is about to leave on a long trip. Tell him to take care.
  - Your friend is about to ride home alone on a dark, busy highway. Tell her to look after herself.
  cues_es:
  - Tu amigo está por salir de viaje. Dile que se cuide.
  - Tu amiga va a regresar sola a casa por una carretera oscura y transitada. Dile que se cuide.
  attested_by:
  - YUAES0007014
- id: ka_xiik_tech_uts
  yua: Ka xi'ik tech uts
  en: Hope it goes well for you.
  es: Que te vaya bien.
  syllables:
  - uts
  - tech uts
  - xi'ik tech uts
  - Ka xi'ik tech uts
  literal: may go to-you well
  literal_es: que vaya a-ti bien
  glosses:
    uts: good, well
    tech uts: well for you
    xi'ik tech uts: may it go well for you
    Ka: may, that
  glosses_es:
    uts: bien, bueno
    tech uts: bien para ti
    xi'ik tech uts: que te vaya bien
    Ka: que
  note: The first little word turns the sentence into a wish, and the last word means good. People say it to someone who
    is heading off.
  note_es: La primera palabrita convierte la frase en un deseo, y la última significa bien. Se le dice a quien se va.
  cues:
  - Your neighbor is leaving for the city. Wish him well.
  - A customer is leaving the shop for a long trip. Tell her you hope it goes well.
  cues_es:
  - Tu vecino sale para la ciudad. Deséale que le vaya bien.
  - Una clienta sale de la tienda para un viaje largo. Dile que le vaya bien.
  attested_by:
  - YUAES0007018
- id: tak_kaakaate
  yua: Tak ka'aka'ate'
  en: See you later today.
  es: Hasta más tarde.
  syllables:
  - ka'ate'
  - ka'aka'ate'
  - Tak ka'aka'ate'
  literal: until later-today
  literal_es: hasta más-tarde
  glosses:
    ka'aka'ate': later today, in a while
    Tak: until
  glosses_es:
    ka'aka'ate': más tarde, al rato
    Tak: hasta
  note: Until later on. Use it when you'll see the person again the same day. Three little catches in a row; take it slowly.
  note_es: Hasta más tarde. Se usa cuando vas a volver a ver a la persona ese mismo día. Lleva tres cortecitos seguidos;
    dilo despacio.
  cues:
  - You'll see your coworker again after lunch today. Say, see you later today.
  - You're stepping out for an hour. Tell your friend you'll see him in a bit.
  cues_es:
  - Vas a ver a tu compañero otra vez después de comer, hoy mismo. Dile hasta más tarde.
  - Sales una hora. Dile a tu amigo que lo ves al rato.
  attested_by:
  - YUAES0007023
- id: ka_jeelsabaj
  yua: Ka je'elsabaj
  en: Sleep well. Rest up.
  es: Que descanses.
  syllables:
  - abaj
  - je'elsabaj
  - Ka je'elsabaj
  literal: may you-rest-yourself
  literal_es: que descanses-te
  glosses:
    abaj: yourself
    je'els: rest
    Ka: may, that
  glosses_es:
    abaj: a ti mismo
    je'els: descansar
    Ka: que
  note: The same yourself ending as take care, and the same wish-word in front as hope it goes well for you.
  note_es: La misma terminación de a ti mismo que en cuídate, y la misma palabrita de deseo al inicio que en que te vaya
    bien.
  cues:
  - The owner of the guesthouse says good night and heads to her hammock. Wish her a good rest.
  cues_es:
  - La dueña de la posada da las buenas noches y se va a su hamaca. Deséale que descanse.
  attested_by:
  - YUAES0007017
- id: tak_saamal_in_suut
  yua: Tak sáamal in suut
  en: I'll be back tomorrow.
  es: Mañana regreso.
  syllables:
  - suut
  - in suut
  - sáamal in suut
  - Tak sáamal in suut
  literal: until tomorrow my return
  literal_es: hasta mañana mi regreso
  glosses:
    suut: come back, return
    in suut: my coming back
    sáamal in suut: tomorrow I come back
    Tak: until
  glosses_es:
    suut: regresar, volver
    in suut: mi regreso
    sáamal in suut: mañana regreso
    Tak: hasta
  note: You know tomorrow from see you tomorrow. The last word means come back, and the little word before it is the same
    one that meant my in my name.
  note_es: Mañana ya lo conoces de hasta mañana. La última palabra significa regresar, y la palabrita de antes es la misma
    que significaba mi en mi nombre.
  cues:
  - You're leaving the workshop for the day and will return in the morning. Say you'll be back tomorrow.
  - The fruit seller asks if you'll come by again. Tell her you'll be back tomorrow.
  cues_es:
  - Sales del taller por hoy y vuelves por la mañana. Di que mañana regresas.
  - La señora de la fruta te pregunta si vas a volver. Dile que mañana regresas.
  attested_by:
  - YUAES0007024
  transforms:
  - prompt_en: Now say, see you tomorrow then, with the word for then at the very end.
    prompt_es: Ahora di, hasta mañana, pues, con la palabra para entonces al final.
    yua: Tak sáamal túun
    attested_by:
    - YUAES0007012
    - YUAES0007028
grammar_note: 'The three greetings share one shape: the word for good, then the time of day. And the two wishes, hope it
  goes well and rest well, both start with the same little word that turns a sentence into a wish.'
grammar_note_es: 'Los tres saludos tienen la misma forma: la palabra para bueno y luego el momento del día. Y los dos deseos,
  que te vaya bien y que descanses, empiezan con la misma palabrita que convierte la frase en un deseo.'
closing:
  id: l02_close
  setting_en: Late afternoon; the visitor passes the fruit seller again as she packs up her stall.
  setting_es: A media tarde; el visitante vuelve a pasar junto a la señora de la fruta mientras recoge su puesto.
  lines:
  - speaker: A
    yua: Ma'alob u chíinil k'iin
    en: Good afternoon.
    es: Buenas tardes.
    attested_by:
    - STD0003
  - speaker: B
    yua: Ma'alob u chíinil k'iin. Bix túun
    en: Good afternoon. How's it going?
    es: Buenas tardes. ¿Qué tal?
    attested_by:
    - words
  - speaker: A
    yua: Ma'alob. Táan in bin
    en: Fine. I'm heading off.
    es: Bien. Ya me voy.
    attested_by:
    - YUAES0007025
  - speaker: B
    yua: Ma'alob túun. Tak sáamal
    en: Alright then. See you tomorrow.
    es: Bueno, está bien. Hasta mañana.
    attested_by:
    - YUAES0007013
    - YUAES0007012
  - speaker: A
    yua: Tak sáamal in suut. Ma'alob áak'ab
    en: I'll be back tomorrow. Good night.
    es: Mañana regreso. Buenas noches.
    attested_by:
    - words
  - speaker: B
    yua: Ma'alob áak'ab. Ka je'elsabaj
    en: Good night. Rest well.
    es: Buenas noches. Que descanses.
    attested_by:
    - words
