  setting_es: Ya de noche en la misma casa; una joven le da las buenas noches a su hermano mayor antes de acostarse.
  lines:
  - speaker: A
    yua: Nooches suku'un
    en: Good night, brother.
    es: Buenas noches hermano.
    attested_by:
    - YUAES0006995
  - speaker: B
    yua: Nooches kiik. Bix a beel
    en: Good night, sister. How are you?
    es: Buenas noches hermana. ¿Cómo estás?
    attested_by:
    - words
  - speaker: A
    yua: Ma'alob. Tak sáamal túun
    en: Fine. Alright, see you tomorrow.
    es: Bien. Bueno, hasta mañana.
    attested_by:
    - words
  - speaker: B
    yua: Ma'alob túun. Ka je'elsabaj
    en: OK then. Sleep well.
    es: Bueno, está bien. Que descanses.
    attested_by:
    - words
  - speaker: A
    yua: Tak sáamal suku'un
    en: See you tomorrow, brother.
    es: Hasta mañana hermano.
    attested_by:
    - YUAES0007111
  - speaker: B
    yua: Tak sáamal kiik
    en: See you tomorrow, sister.
    es: Hasta mañana hermana.
    attested_by:
    - YUAES0007112
