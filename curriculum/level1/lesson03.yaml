    en: My town is Hunucmá. My town is beautiful.
    es: Mi pueblo es Hunucmá. Mi pueblo es bonito.
    attested_by:
    - words
  - speaker: A
    yua: Ma'alob túun. Táan in bin. Tak tu jeel k'iin
    en: Alright then. I'm off. See you later.
    es: Está bien, pues. Ya me voy. Hasta otro día.
    attested_by:
